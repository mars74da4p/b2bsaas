version: '3.8'

services:
  clientflow-app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://clientflow:secret_pass@db:5432/clientflow_db
      - PORTAL_DOMAIN=http://localhost:3000
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: clientflow
      POSTGRES_PASSWORD: secret_pass
      POSTGRES_DB: clientflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: